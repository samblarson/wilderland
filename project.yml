name: Wilderland
options:
  bundleIdPrefix: com.wilderland
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  WilderCore:
    path: Core
targets:
  Wilderland:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: WilderCore
        product: WilderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wilderland.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Wilderland
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Wilderland listens through the microphone to identify animals by their calls. Audio is analyzed on your iPhone and never uploaded.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Your location is used on this iPhone to rule out animals that don't live in your region. It is never sent anywhere.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
